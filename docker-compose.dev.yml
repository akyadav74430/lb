services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: lovebite-app-dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      database:
        condition: service_healthy
    env_file:
      - .env.docker
    environment:
      - NODE_ENV=development
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
      - lovebite_uploads_dev:/app/uploads
    command: npm run dev
    networks:
      - lovebite-dev-network

  database:
    image: mysql:8.0
    container_name: lovebite-db-dev
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-lovebite}
      MYSQL_USER: ${MYSQL_USER:-lovebite}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-lovebite_secure_pass_2026}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-lovebite_root_secret_2026}
    ports:
      - "3306:3306" # Exposed for local GUI tools in development
    volumes:
      - mysql_dev_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - -h
        - localhost
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - lovebite-dev-network

volumes:
  mysql_dev_data:
  lovebite_uploads_dev:

networks:
  lovebite-dev-network:
    driver: bridge
